<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorvete</title>
</head>
<body>
    
    <input type="text" id="sabor" placeholder="Digite um Sabor">

    <p id="resultado"></p>

    <script>

        const input = document.getElementById("sabor")
        const resultado = document.getElementById("resultado")

        input.addEventListener("input", function(){

            const texto = input.value.toLowerCase()

            if (texto.length > 3) {

                if(texto.includes("chocolate")) {
                    resultado.textContent = "Eu amo sorvete de chocolate"
                }else if (texto.includes("flocos")) {
                    resultado.textContent = "Ahh, mas chocolate é meu favorito"
                } else {
                    resultado.textContent = "Ahh, eu esperava um sabor de sorvete..."
                }

            } else {
                resultado.textContent = ""
            }

        })

    </script>

</body>
</html>
