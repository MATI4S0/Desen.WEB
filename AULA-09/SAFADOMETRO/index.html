<!DOCTYPE html>
<html lang="pt_br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safadômetro</title>
</head>
<body>
    
    <form action="">

        <div class="grupo">
            <label for="dia">Dia: </label>
            <input type="number" name="campo_dia" min="1" max="31">
        </div>

        <div class="grupo">
            <label for="mes">Mês: </label>
            <input type="number" name="campo_mes" min="1" max="12">
        </div>

        <div class="grupo">
            <label for="Ano">Ano: </label>
            <input type="number" name="campo_ano" min="1" max="2026">
        </div>

        <input type="submit" value="Safadometrar">

    </form>

</body>
</html>
